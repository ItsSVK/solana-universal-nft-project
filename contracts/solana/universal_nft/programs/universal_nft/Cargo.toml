[package]
name = "universal_nft"
version = "0.1.0"
description = "Universal NFT program for cross-chain NFT transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "universal_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# mpl-token-metadata = "4.0.0"  # Temporarily commented out due to dependency conflicts

